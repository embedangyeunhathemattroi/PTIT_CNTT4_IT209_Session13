services:
  mysql:
    image: mysql:8.4
    container_name: campus-hub-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: campus_hub
      MYSQL_USER: campus
      MYSQL_PASSWORD: campus123
      MYSQL_ROOT_PASSWORD: root123
    volumes:
      - campus-hub-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: .
    image: campus-hub-backend:latest
    container_name: campus-hub-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/campus_hub?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: campus
      SPRING_DATASOURCE_PASSWORD: campus123
      SERVER_PORT: 8080
    ports:
      - "8080:8080"

volumes:
  campus-hub-mysql-data:
